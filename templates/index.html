<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Encryption Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #00d4ff;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel.encrypt h2 {
            color: #00ff88;
        }

        .panel.decrypt h2 {
            color: #ff6b6b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #b0b0b0;
        }

        textarea, input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        textarea:focus, input[type="password"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-encrypt {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
        }

        .btn-encrypt:hover {
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-decrypt {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: #fff;
        }

        .btn-decrypt:hover {
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .result-container {
            margin-top: 20px;
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .result-label {
            font-weight: 500;
            color: #b0b0b0;
        }

        .btn-copy {
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 4px;
            width: auto;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
            transform: none;
        }

        .btn-copy.copied {
            background: #00ff88;
            color: #000;
        }

        .result-box {
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            word-break: break-all;
            min-height: 80px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .success {
            color: #00ff88;
        }

        .icon {
            font-size: 1.5rem;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text Encryption Tool</h1>

        <div class="panels">
            <div class="panel encrypt">
                <h2><span class="icon">🔒</span> Encrypt</h2>
                <form id="encryptForm">
                    <div class="form-group">
                        <label for="encryptText">Text to Encrypt</label>
                        <textarea id="encryptText" placeholder="Enter your secret message..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="encryptPassword">Password</label>
                        <input type="password" id="encryptPassword" placeholder="Enter encryption password">
                    </div>
                    <button type="submit" class="btn-encrypt">Encrypt Text</button>
                </form>
                <div class="result-container" id="encryptResult">
                    <div class="result-header">
                        <span class="result-label">Encrypted Output</span>
                        <button class="btn-copy" onclick="copyToClipboard('encryptOutput', this)">Copy</button>
                    </div>
                    <div class="result-box" id="encryptOutput"></div>
                </div>
            </div>

            <div class="panel decrypt">
                <h2><span class="icon">🔓</span> Decrypt</h2>
                <form id="decryptForm">
                    <div class="form-group">
                        <label for="decryptText">Encrypted Text</label>
                        <textarea id="decryptText" placeholder="Paste encrypted text here..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="decryptPassword">Password</label>
                        <input type="password" id="decryptPassword" placeholder="Enter decryption password">
                    </div>
                    <button type="submit" class="btn-decrypt">Decrypt Text</button>
                </form>
                <div class="result-container" id="decryptResult">
                    <div class="result-header">
                        <span class="result-label">Decrypted Output</span>
                        <button class="btn-copy" onclick="copyToClipboard('decryptOutput', this)">Copy</button>
                    </div>
                    <div class="result-box" id="decryptOutput"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            All encryption happens locally in your browser. Your data never leaves your computer.
        </div>
    </div>

    <script>
        document.getElementById('encryptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('encryptText').value;
            const password = document.getElementById('encryptPassword').value;

            try {
                const response = await fetch('/encrypt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, password })
                });

                const data = await response.json();
                const resultContainer = document.getElementById('encryptResult');
                const output = document.getElementById('encryptOutput');

                resultContainer.classList.add('show');

                if (data.error) {
                    output.textContent = data.error;
                    output.className = 'result-box error';
                } else {
                    output.textContent = data.result;
                    output.className = 'result-box success';
                }
            } catch (err) {
                console.error(err);
            }
        });

        document.getElementById('decryptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('decryptText').value;
            const password = document.getElementById('decryptPassword').value;

            try {
                const response = await fetch('/decrypt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, password })
                });

                const data = await response.json();
                const resultContainer = document.getElementById('decryptResult');
                const output = document.getElementById('decryptOutput');

                resultContainer.classList.add('show');

                if (data.error) {
                    output.textContent = data.error;
                    output.className = 'result-box error';
                } else {
                    output.textContent = data.result;
                    output.className = 'result-box success';
                }
            } catch (err) {
                console.error(err);
            }
        });

        function copyToClipboard(elementId, button) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = 'Copy';
                    button.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
